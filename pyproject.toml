[project]
name = "animal-agent"
version = "0.1.0"
description = "LiveKit voice/chat agent worker for animal"
requires-python = ">=3.12,<3.15"
dependencies = [
    "exa-py==2.23.0",
    "httpx>=0.28.1",
    "livekit-agents==1.8.3",
    "livekit-plugins-anthropic==1.8.3",
    "livekit-plugins-deepgram==1.8.3",
    "livekit-plugins-elevenlabs==1.8.3",
    "livekit-plugins-silero==1.8.3",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]
